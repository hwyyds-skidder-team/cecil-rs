[package]
name = "cecli-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

cecli = { path = "../crates/cecli" }
cecli-pe = { path = "../crates/cecli-pe" }
cecli-metadata = { path = "../crates/cecli-metadata" }
cecli-pdb = { path = "../crates/cecli-pdb" }
cecli-mdb = { path = "../crates/cecli-mdb" }

# Prevent this from accidentally becoming part of the parent workspace.
[workspace]

[[bin]]
name = "read_assembly"
path = "fuzz_targets/read_assembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_metadata"
path = "fuzz_targets/parse_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_portable_pdb"
path = "fuzz_targets/parse_portable_pdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_native_pdb"
path = "fuzz_targets/parse_native_pdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_mdb"
path = "fuzz_targets/parse_mdb.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
