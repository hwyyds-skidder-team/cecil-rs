[package]
name = "cecil-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

cecil = { package = "cecil-rs", path = "../crates/cecil-rs" }
cecil-pe = { path = "../crates/cecil-pe" }
cecil-metadata = { path = "../crates/cecil-metadata" }
cecil-pdb = { path = "../crates/cecil-pdb" }
cecil-mdb = { path = "../crates/cecil-mdb" }

# Prevent this from accidentally becoming part of the parent workspace.
[workspace]

[[bin]]
name = "read_assembly"
path = "fuzz_targets/read_assembly.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_metadata"
path = "fuzz_targets/parse_metadata.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_portable_pdb"
path = "fuzz_targets/parse_portable_pdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_native_pdb"
path = "fuzz_targets/parse_native_pdb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_mdb"
path = "fuzz_targets/parse_mdb.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
